<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UNBLUR — AI Deblur</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0e0e10;color:#f4f4f5;font-family:system-ui,-apple-system,sans-serif}
main{max-width:920px;margin:auto;padding:22px}h1{font-size:42px;margin:0}.sub{color:#a1a1aa}
.panel{background:#18181b;border:1px solid #2b2b30;border-radius:18px;padding:20px;margin-top:20px}
.drop{border:2px dashed #52525b;border-radius:16px;padding:38px 18px;text-align:center;cursor:pointer}
.drop.drag{background:#222225;border-color:#fff}.drop b{font-size:20px}
input[type=file]{display:none}button{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;background:#fff;color:#111}
button:disabled{opacity:.45;cursor:not-allowed}.row{display:flex;gap:16px;flex-wrap:wrap;margin-top:18px}.card{flex:1;min-width:280px;background:#111113;padding:12px;border-radius:14px}
.card b{display:block;margin-bottom:10px}img{width:100%;max-height:540px;object-fit:contain;background:#09090b;border-radius:9px}
.status{min-height:25px;margin-top:14px;color:#d4d4d8}.small{font-size:13px;color:#a1a1aa;line-height:1.5}
</style>
</head>
<body>
<main>
<h1>UNBLUR</h1><div class="sub">AI deblurring zdjęć</div>
<div class="panel">
<div id="drop" class="drop">
<b>Wybierz lub przeciągnij zdjęcie</b><br>
<span class="small">JPG / PNG</span><br><br>
<button id="pick">Wybierz zdjęcie</button><input id="file" type="file" accept="image/jpeg,image/png">
</div>
<div class="row">
<div class="card"><b>Oryginał</b><img id="before"></div>
<div class="card"><b>Wynik AI</b><img id="after"></div>
</div>
<div class="status" id="status"></div>
<button id="run" disabled>✨ Usuń blur</button>
<a id="download" download="unblur.png" style="display:none"><button>Pobierz wynik</button></a>
</div>
<div class="panel small">
<strong>Tryb:</strong> IFAN — Iterative Filter Adaptive Network, model wyspecjalizowany w usuwaniu defocus blur.
Nie jest to zwykłe wyostrzanie. Przy bardzo mocnym rozmyciu część szczegółów jest rekonstruowana przez model.
</div>
</main>
<script>
const $=x=>document.getElementById(x); let file=null;
$("pick").onclick=e=>{$("file").click();e.stopPropagation()};
$("drop").onclick=e=>{if(e.target!==$("pick"))$("file").click()};
$("file").onchange=e=>select(e.target.files[0]);
$("drop").ondragover=e=>{e.preventDefault();$("drop").classList.add("drag")};
$("drop").ondragleave=()=>$("drop").classList.remove("drag");
$("drop").ondrop=e=>{e.preventDefault();$("drop").classList.remove("drag");select(e.dataTransfer.files[0])};

function select(f){
 if(!f||!/^image\\/(jpeg|png)$/.test(f.type)){status("Wybierz JPG lub PNG.");return}
 file=f;$("before").src=URL.createObjectURL(f);$("after").removeAttribute("src");
 $("run").disabled=false;$("download").style.display="none";status("Zdjęcie gotowe.");
}
function status(t){$("status").textContent=t}

async function compress(f){
 const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(f)});
 const max=1536, scale=Math.min(1,max/Math.max(i.naturalWidth,i.naturalHeight));
 const c=document.createElement("canvas");c.width=Math.round(i.naturalWidth*scale);c.height=Math.round(i.naturalHeight*scale);
 c.getContext("2d").drawImage(i,0,0,c.width,c.height);
 let q=.88, u=c.toDataURL("image/jpeg",q);
 while(u.length>900000&&q>.45){q-=.06;u=c.toDataURL("image/jpeg",q)}
 return u;
}

$("run").onclick=async()=>{
 if(!file)return;
 $("run").disabled=true;$("download").style.display="none";status("Przygotowuję zdjęcie…");
 try{
  const image=await compress(file);status("Model AI pracuje…");
  const r=await fetch("/api/deblur",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({image})});
  const j=await r.json();
  if(!r.ok)throw new Error(j.error||"Błąd serwera");
  $("after").src=j.output;
  $("download").href=j.output;$("download").style.display="inline-block";status("Gotowe.");
 }catch(e){status("Błąd: "+e.message);console.error(e)}
 finally{$("run").disabled=false}
};
</script>
</body>
</html>
